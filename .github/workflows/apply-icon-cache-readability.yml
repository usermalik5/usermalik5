name: Apply icon cache and readability fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'feat: make icon sync seamless and less intrusive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------------------------------------------------------------
          # tech_secops4.py: helper verification + persistent per-device cache
          # ---------------------------------------------------------------
          p = Path('tech_secops4.py')
          s = p.read_text(encoding='utf-8')

          # Replace the whole icon-sync entry point with a cache-aware version.
          start = s.index('    def action_sec_show_icons(self):')
          end = s.index('    def action_sec_backup_restore(self):', start)
          new_method = r'''    def _icon_device_key(self, serial):
        return hashlib.sha256(serial.encode("utf-8", "replace")).hexdigest()[:32]

    def _icon_device_cache_dir(self, serial):
        path = os.path.join(get_settings_dir(), "icon_cache", self._icon_device_key(serial))
        os.makedirs(path, exist_ok=True)
        return path

    def _icon_cache_meta_path(self, serial):
        return os.path.join(self._icon_device_cache_dir(serial), "sync.json")

    def _icon_load_meta(self, serial):
        try:
            with open(self._icon_cache_meta_path(serial), "r", encoding="utf-8") as f:
                return json.load(f)
        except (OSError, ValueError, TypeError):
            return {}

    def _icon_save_meta(self, serial, meta):
        path = self._icon_cache_meta_path(serial)
        tmp = path + ".tmp"
        with open(tmp, "w", encoding="utf-8") as f:
            json.dump(meta, f, indent=2, sort_keys=True)
        os.replace(tmp, path)

    @staticmethod
    def _icon_hash_file(path):
        h = hashlib.sha256()
        with open(path, "rb") as f:
            for chunk in iter(lambda: f.read(1024 * 1024), b""):
                h.update(chunk)
        return h.hexdigest()

    def _icon_run_cmd(self, args, timeout=15):
        return subprocess.run([self.scrcpy_adb] + args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=timeout)

    def _icon_wait_for_helper(self, attempts=4, delay=1.0):
        """Verify helper presence; package-manager transients are NOT treated as missing."""
        last = ""
        for attempt in range(attempts):
            r = self._icon_run_cmd(["shell", "pm", "path", "com.drox.apkiconhelper"])
            out = (r.stdout or "").strip()
            err = (r.stderr or "").strip()
            last = out or err
            if "package:" in out:
                return out.split("package:", 1)[1].splitlines()[0].strip(), None
            if any(x in (out + " " + err).lower() for x in ("can't find service", "package manager", "binder", "service")):
                time.sleep(delay)
                continue
            if attempt < attempts - 1:
                time.sleep(delay)
        return None, last

    def _icon_package_fingerprint(self):
        r = self._icon_run_cmd(["shell", "pm", "list", "packages"], 30)
        packages = sorted(
            line.split(":", 1)[1].strip()
            for line in (r.stdout or "").splitlines()
            if line.strip().startswith("package:") and line.split(":", 1)[1].strip()
        )
        if not packages:
            return None, 0
        return hashlib.sha256("\n".join(packages).encode("utf-8")).hexdigest(), len(packages)

    def _icon_restore_device_cache(self, serial):
        """Restore this phone's persisted icons into the existing shared icon lookup directory."""
        cache_dir = self._icon_device_cache_dir(serial)
        meta = self._icon_load_meta(serial)
        if not meta.get("package_fingerprint"):
            return False
        local = get_cache_dir()
        os.makedirs(local, exist_ok=True)
        manifest = os.path.join(cache_dir, "packages.jsonl")
        if not os.path.isfile(manifest):
            return False
        copied = 0
        for name in os.listdir(cache_dir):
            if not name.endswith(".png"):
                continue
            shutil.copy2(os.path.join(cache_dir, name), os.path.join(local, name))
            copied += 1
        return copied > 0

    def _icon_store_device_cache(self, serial, manifest, package_fingerprint, package_count):
        cache_dir = self._icon_device_cache_dir(serial)
        local = os.path.dirname(manifest)
        os.makedirs(cache_dir, exist_ok=True)
        shutil.copy2(manifest, os.path.join(cache_dir, "packages.jsonl"))
        icon_count = 0
        for name in os.listdir(local):
            if not name.endswith(".png"):
                continue
            src = os.path.join(local, name)
            dst = os.path.join(cache_dir, name)
            try:
                shutil.copy2(src, dst)
                icon_count += 1
            except OSError:
                pass
        self._icon_save_meta(serial, {
            "serial": serial,
            "package_fingerprint": package_fingerprint,
            "package_count": package_count,
            "icon_count": icon_count,
            "helper_present": True,
            "synced_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
        })

    def action_sec_show_icons(self, automatic=False, force=False):
        def worker():
            serial = None
            try:
                # Do not race ADB initialization immediately after the device changes state.
                for _ in range(3):
                    st = self._icon_run_cmd(["get-state"]).stdout.strip().lower()
                    if st == "device":
                        break
                    if st == "unauthorized":
                        self.after(0, lambda: self._sec_log("[GeloTech] Icons: authorize USB debugging on the phone first.", "#e74c3c"))
                        return
                    time.sleep(1.0)
                else:
                    self.after(0, lambda: self._sec_log("[GeloTech] Icons: device is not ready yet; will retry on the next device event.", "#e74c3c"))
                    return

                rserial = self._icon_run_cmd(["get-serialno"])
                serial = (rserial.stdout or "").strip()
                if not serial or serial.lower() in {"unknown", "no permissions"}:
                    self.after(0, lambda: self._sec_log("[GeloTech] Icons: could not identify the connected device.", "#e74c3c"))
                    return

                package_fingerprint, package_count = self._icon_package_fingerprint()
                if package_fingerprint is None:
                    self.after(0, lambda: self._sec_log("[GeloTech] Icons: package list is not ready; skipping automatic sync for now.", "#f39c12"))
                    return

                meta = self._icon_load_meta(serial)
                if automatic and not force and meta.get("package_fingerprint") == package_fingerprint:
                    if self._icon_restore_device_cache(serial):
                        self._sec_icon_cache = {}
                        self._sec_tree_icon_cache = {}
                        self._app_labels = None
                        self.after(0, self._sec_render_rows)
                        self.after(0, lambda: self._sec_log(f"[GeloTech] Icons ready from device cache ({meta.get('icon_count', 0)} icons; no re-install/export).", "#2ecc71"))
                        return

                # Existing helper is a prerequisite, but its presence is verified first.
                helper_path, helper_error = self._icon_wait_for_helper()
                if not helper_path:
                    helper = os.path.join(get_bundle_dir(), "ApkIconHelper.apk")
                    if not os.path.isfile(helper):
                        self.after(0, lambda: self._sec_log("[GeloTech] Missing ApkIconHelper.apk in the application bundle.", "#e74c3c"))
                        return
                    # A package-manager/service failure is NOT proof that the helper is absent.
                    if helper_error and any(x in helper_error.lower() for x in ("can't find service", "service", "binder")):
                        self.after(0, lambda: self._sec_log("[GeloTech] Android package manager is still starting; no APK was pushed.", "#f39c12"))
                        return
                    self.after(0, lambda: self._sec_log("[GeloTech] ApkIconHelper not found; installing it once...", "#58a6ff"))
                    inst = self._icon_run_cmd(["install", "-r", "-t", helper], 60)
                    combined = (inst.stdout or "") + (inst.stderr or "")
                    if "Success" not in combined:
                        self.after(0, lambda m=combined.strip()[-300:]: self._sec_log(f"[GeloTech] Helper install failed: {m}", "#e74c3c"))
                        return
                    helper_path, helper_error = self._icon_wait_for_helper()
                    if not helper_path:
                        self.after(0, lambda: self._sec_log("[GeloTech] Helper install completed but verification failed; automatic sync stopped.", "#e74c3c"))
                        return
                # If helper exists, NEVER reinstall it just because automatic icon sync is running.
                meta["helper_present"] = True
                meta["helper_verified_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
                self._icon_save_meta(serial, meta)

                # Cache still valid after helper verification? Avoid an expensive export.
                if not force and meta.get("package_fingerprint") == package_fingerprint and self._icon_restore_device_cache(serial):
                    self._sec_icon_cache = {}
                    self._sec_tree_icon_cache = {}
                    self._app_labels = None
                    self.after(0, self._sec_render_rows)
                    self.after(0, lambda: self._sec_log(f"[GeloTech] Icons restored from cache ({meta.get('icon_count', 0)} icons).", "#2ecc71"))
                    return

                export = "/sdcard/Android/data/com.drox.apkiconhelper/files/apk_icon_export"
                flag = export + "/DONE.flag"
                self._icon_run_cmd(["shell", "rm", "-f", flag])
                self._icon_run_cmd(["shell", "svc", "power", "stayon", "true"])
                self._icon_run_cmd(["shell", "input", "keyevent", "KEYCODE_WAKEUP"])
                self._icon_run_cmd(["shell", "wm", "dismiss-keyguard"])

                def launch():
                    self._icon_run_cmd(["shell", "am", "start", "-n", "com.drox.apkiconhelper/.MainActivity", "--ez", "autoExport", "true"])

                def is_done():
                    chk = self._icon_run_cmd(["shell", "cat", flag])
                    return bool(chk.stdout.strip())

                done = False
                for attempt in range(2):
                    launch()
                    for i in range(60):
                        time.sleep(2)
                        if is_done():
                            done = True
                            break
                    if done:
                        break
                    self.after(0, lambda: self._sec_log("[GeloTech] Icon export timed out; retrying once...", "#f39c12"))
                    self._icon_run_cmd(["shell", "am", "force-stop", "com.drox.apkiconhelper"])
                    time.sleep(2)
                self._icon_run_cmd(["shell", "svc", "power", "stayon", "false"])
                if not done:
                    self.after(0, lambda: self._sec_log("[GeloTech] Icon export did not finish. The phone remains usable; retry on the next device refresh.", "#e74c3c"))
                    return

                local = get_cache_dir()
                os.makedirs(local, exist_ok=True)
                self._icon_run_cmd(["pull", export, local], 120)
                manifest = os.path.join(local, "packages.jsonl")
                if not os.path.isfile(manifest):
                    manifest = os.path.join(local, "apk_icon_export", "packages.jsonl")
                count = 0
                if os.path.isfile(manifest):
                    with open(manifest, "r", encoding="utf-8") as f:
                        for line in f:
                            try:
                                item = json.loads(line)
                                pkg = item.get("package", "")
                                icon = item.get("icon", "")
                                if pkg and icon:
                                    src = os.path.join(os.path.dirname(manifest), icon)
                                    if os.path.isfile(src):
                                        shutil.copy(src, os.path.join(local, f"{pkg}.png"))
                                        count += 1
                            except Exception:
                                pass
                self._icon_store_device_cache(serial, manifest, package_fingerprint, package_count)
                self._icon_run_cmd(["shell", "am", "force-stop", "com.drox.apkiconhelper"])
                self._sec_icon_cache = {}
                self._sec_tree_icon_cache = {}
                self._app_labels = None
                self.after(0, self._sec_render_rows)
                self.after(0, lambda: self._sec_log(f"[GeloTech] Icons synced: {count} apps; device cache updated.", "#2ecc71"))
            except Exception as e:
                if serial:
                    try:
                        meta = self._icon_load_meta(serial)
                        meta["last_error"] = str(e)
                        self._icon_save_meta(serial, meta)
                    except Exception:
                        pass
                self.after(0, lambda e=e: self._sec_log(f"[GeloTech] Icon sync error: {e}", "#e74c3c"))
        threading.Thread(target=worker, daemon=True).start()

'''
          s = s[:start] + new_method + s[end:]
          p.write_text(s, encoding='utf-8')

          # ---------------------------------------------------------------
          # techtool.py: automatic sync becomes cache-aware and only fires once
          # per newly observed serial without treating a disconnect as a reason
          # to re-export immediately.
          # ---------------------------------------------------------------
          p = Path('techtool.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('self._icon_sync_seen_serials = set()', 'self._icon_sync_seen_serials = set()', 1)
          old = '''    def _auto_prepare_new_device_icons(self, devices):
        """Automatically prepare icons when a new single authorized device is detected."""
        try:
            if len(devices) != 1:
                if len(devices) > 1:
                    self.log_message("[GeloTech] Multiple ADB devices connected; automatic icon sync waits until one device remains.")
                return
            serial = devices[0]
            if serial in self._icon_sync_seen_serials:
                return
            self._icon_sync_seen_serials.add(serial)
            self._sec_icon_cache = {}
            self._sec_tree_icon_cache = {}
            self._app_labels = None
            self.log_message(f"[GeloTech] New device detected: {serial}. Preparing app icons automatically...")
            self.after(200, self.action_sec_show_icons)
        except Exception as exc:
            self.log_message(f"[GeloTech] Automatic icon preparation skipped: {exc}")
'''
          new = '''    def _auto_prepare_new_device_icons(self, devices):
        """Prepare icons only for a genuinely new device; the icon worker owns persistent cache verification."""
        try:
            if len(devices) != 1:
                if len(devices) > 1:
                    self.log_message("[GeloTech] Multiple ADB devices connected; automatic icon sync waits for one device.")
                return
            serial = devices[0]
            if serial in self._icon_sync_seen_serials:
                return
            self._icon_sync_seen_serials.add(serial)
            self._sec_icon_cache = {}
            self._sec_tree_icon_cache = {}
            self._app_labels = None
            self.log_message(f"[GeloTech] Device ready: {serial}. Checking saved icon cache...")
            self.after(800, lambda: self.action_sec_show_icons(automatic=True))
        except Exception as exc:
            self.log_message(f"[GeloTech] Automatic icon preparation skipped: {exc}")
'''
          if old not in s:
              raise SystemExit('techtool.py auto icon method not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------------------------------------------------------
          # tech_ui.py: replace clipped instructional copy with short, wrapped text.
          # ---------------------------------------------------------------
          p = Path('tech_ui.py')
          s = p.read_text(encoding='utf-8')
          old_usb = 'USB debugging: Settings → About Phone → tap Build Number 7× → Developer Options → USB debugging ON → connect cable → tap “Allow” (tick Always allow) → Refresh'
          new_usb = 'USB setup: enable Developer Options + USB debugging, connect the phone, then tap Allow. GeloTech prepares app icons automatically.'
          if old_usb in s:
              s = s.replace(old_usb, new_usb, 1)
          old_how = 'How to use: press Refresh to load user apps. Load Apps ▼ loads All / User / System / Disabled lists — Advanced Filter loads apps from the database. Scan Bloatware ▼ picks a UAD level (Recommended / Advanced / Expert / Unsafe), checks all matching apps and offers actions. Restore/Backup restores apps you removed. Right-click any row for per-app options (Disable / Uninstall / Clear App Data / Backup / Exclude / Info).'
          new_how = 'How to use: Refresh loads apps. Load Apps selects All / User / System / Disabled. Scan Bloatware filters by UAD level. Advanced Filter uses the database. Right-click a row for app actions.'
          if old_how in s:
              s = s.replace(old_how, new_how, 1)
          s = s.replace('sticky="w")\n\n        self._sec_banner_howto.grid', 'sticky="ew")\n\n        self._sec_banner_howto.grid', 1)
          s = s.replace('sticky="w")\n\n        # Row 1 - Status bar', 'sticky="ew")\n\n        # Row 1 - Status bar', 1)
          p.write_text(s, encoding='utf-8')

          print('Applied cache-aware icon sync and concise Dashboard/App Cleaner guidance.')
          PY

      - name: Install and validate
        run: |
          python -m pip install -q pytest
          python -m compileall -q techtool.py tech_ui.py tech_secops4.py
          python -m pytest -q
          python - <<'PY'
          from pathlib import Path
          sec4 = Path('tech_secops4.py').read_text(encoding='utf-8')
          app = Path('techtool.py').read_text(encoding='utf-8')
          ui = Path('tech_ui.py').read_text(encoding='utf-8')
          assert 'def action_sec_show_icons(self, automatic=False, force=False):' in sec4
          assert '_icon_device_cache_dir' in sec4
          assert '_icon_wait_for_helper' in sec4
          assert 'self.after(800, lambda: self.action_sec_show_icons(automatic=True))' in app
          assert 'USB setup: enable Developer Options + USB debugging' in ui
          assert 'How to use: Refresh loads apps.' in ui
          print('Source assertions passed.')
          PY

      - name: Remove workflow after successful application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add techtool.py tech_ui.py tech_secops4.py
          git rm .github/workflows/apply-icon-cache-readability.yml
          git commit -m "feat: make icon sync seamless and less intrusive"
          git push origin main
