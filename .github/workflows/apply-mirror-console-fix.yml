name: Apply mirror console restoration fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix dashboard mirror console restoration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch tech_phone_mirror.py
        shell: python
        run: |
          from pathlib import Path

          path = Path('tech_phone_mirror.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('    def _hide_dashboard_console(self):')
          end = text.index('    def start(self, scrcpy_exe, scrcpy_adb, scrcpy_dir, spawn_x, spawn_y):', start)

          replacement = '''    def _hide_dashboard_console(self):
        """Temporarily hide the dashboard log panel while scrcpy owns the
        phone screen.  The dashboard's current _dash_log_rect remains the
        canonical position; we do not permanently replace or destroy the
        widget."""
        d = self._dashboard
        if not d or self._hidden_console is not None:
            return
        try:
            consoles = getattr(d, "_log_consoles", [])
            if not consoles:
                return
            c = consoles[0].get("frame")
            if c is None or not c.winfo_exists():
                return
            self._hidden_console = c
            self._console_place = getattr(d, "_dash_log_rect", None)
            c.place_forget()
        except Exception as e:
            self._hidden_console = None
            self._console_place = None
            try:
                self._log(f"[PHONE] Could not hide dashboard console: {e}")
            except Exception:
                pass

    def _restore_dashboard_console(self, attempts=12):
        """Restore the dashboard log panel on Tk's UI thread.

        Use the dashboard's current geometry rather than stale coordinates
        captured when mirroring started.  Retry briefly because Tk may still
        be processing a page resize/configure event when scrcpy exits.
        """
        d = self._dashboard
        c = self._hidden_console
        if d is None or c is None:
            return

        try:
            if not d.winfo_exists() or not c.winfo_exists():
                self._hidden_console = None
                self._console_place = None
                return
        except Exception:
            return

        try:
            # _dash_log_rect is recalculated by the dashboard when its phone
            # container changes size.  Prefer it over the old saved rectangle.
            r = getattr(d, "_dash_log_rect", None) or self._console_place
            if not r or len(r) != 4:
                raise RuntimeError("dashboard log rectangle unavailable")

            x, y, w, h = (int(v) for v in r)
            c.place(x=x, y=y, width=max(1, w), height=max(1, h))
            c.lift()
            c.update_idletasks()
            d.update_idletasks()

            # The phone screen uses a rounded Win32 region.  Reapply the
            # clipping after place_forget/place so the restored console looks
            # identical to the pre-mirror dashboard in both themes.
            try:
                clipper = getattr(d, "_clip_dash_console", None)
                if clipper is not None:
                    clipper(w, h, int(getattr(d, "_dash_log_rect", r)[2] * 0 + 24), attempts=1)
            except Exception:
                pass

            # If Tk has not mapped the widget yet, leave the saved reference
            # intact and retry from the main event loop.
            if not c.winfo_ismapped() and attempts > 0:
                d.after(50, lambda: self._restore_dashboard_console(attempts - 1))
                return

            self._hidden_console = None
            self._console_place = None
        except Exception as e:
            if attempts > 0:
                try:
                    d.after(50, lambda: self._restore_dashboard_console(attempts - 1))
                    return
                except Exception:
                    pass
            try:
                self._log(f"[PHONE] Dashboard console restore error: {e}")
            except Exception:
                pass

    def _restore_console_safe(self):
        """Always restore the dashboard console through Tk's main thread."""
        d = self._dashboard
        if d is not None:
            try:
                d.after_idle(self._restore_dashboard_console)
                return
            except Exception:
                pass
        self._restore_dashboard_console()

'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech_phone_mirror.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix dashboard mirror console restoration"
          git push
