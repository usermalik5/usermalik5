name: Fix bloatware filters

on:
  push:
    branches: [fix/bloatware-filters]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate complete-device bloatware scanner
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          p = root / 'techtool.py'
          s = p.read_text(encoding='utf-8')
          import_line = 'from tech_navigation import NavigationController\n'
          new_import = import_line + 'from tech_bloatware import BloatwareFilterMixin\n'
          if 'from tech_bloatware import BloatwareFilterMixin' not in s:
              if import_line not in s:
                  raise SystemExit('NavigationController import anchor not found')
              s = s.replace(import_line, new_import, 1)
          old = 'class GeloTechTool(ctk.CTk, UiMixin, SettingsMixin, SecScanMixin, SecOpsMixin, SecOps3Mixin, SecOps2Mixin, SecOps4Mixin, DashboardMixin, VtOpsMixin, MiscMixin):'
          new = 'class GeloTechTool(ctk.CTk, UiMixin, SettingsMixin, SecScanMixin, SecOpsMixin, BloatwareFilterMixin, SecOps3Mixin, SecOps2Mixin, SecOps4Mixin, DashboardMixin, VtOpsMixin, MiscMixin):'
          if old not in s:
              raise SystemExit('GeloTechTool inheritance anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = root / 'tech_common.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('APP_VERSION = "1.6.0"', 'APP_VERSION = "1.7.1"', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add focused regression tests
        run: |
          mkdir -p tests
          cat > tests/test_bloatware_filter.py <<'PY'
          from tech_bloatware import BloatwareFilterMixin

          class FakeMixin(BloatwareFilterMixin):
              def _load_app_labels(self):
                  return {"com.example.rec": "Recommended App"}

              def _build_uad_lookup(self):
                  return {
                      "com.example.rec": {"removal": "Recommended", "description": "recommended"},
                      "com.example.exp": {"removal": "Expert", "description": "expert"},
                  }

              def _load_excluded_clean(self):
                  return set()

              def _load_excluded_uninstall(self):
                  return set()

              def _resolve_label(self, package_id):
                  return package_id

          def test_complete_package_entries_include_system_and_user_packages(monkeypatch):
              fake = FakeMixin()
              fake.scrcpy_adb = "adb"
              fake.sec_packages = []

              class Result:
                  stdout = "package:com.example.rec\n"
                  stderr = ""

              monkeypatch.setattr("tech_bloatware.subprocess.run", lambda *a, **k: Result())
              entries = fake._sec_build_complete_package_entries([
                  "com.example.rec", "com.example.exp", "com.example.unknown"
              ])
              by_id = {item["id"]: item for item in entries}
              assert by_id["com.example.rec"]["system"] is False
              assert by_id["com.example.exp"]["system"] is True
              assert by_id["com.example.rec"]["removal"] == "Recommended"

          def test_recommendation_method_is_owned_by_new_mixin():
              assert BloatwareFilterMixin._sec_action_recommendation.__qualname__.startswith("BloatwareFilterMixin.")
          PY

      - name: Validate source
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-bloatware-filters.yml
          git add techtool.py tech_common.py tech_bloatware.py tests/test_bloatware_filter.py
          git commit -m "Fix Scan Bloatware level filters"
          git push origin fix/bloatware-filters
