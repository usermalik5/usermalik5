name: Apply icon cache implementation

on:
  push:
    branches: [fix/icon-cache-implementation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply icon cache
        run: python scripts/apply_icon_cache_only.py
      - name: Verify source
        run: python -m compileall -q tech_secops4.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech_secops4.py
          git rm scripts/apply_icon_cache_only.py .github/workflows/apply-icon-cache-branch.yml
          git commit -m "feat: make icon sync seamless and less intrusive"
          git push origin fix/icon-cache-implementation
