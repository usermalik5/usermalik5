name: Apply icon cache/readability fixes on branch

on:
  push:
    branches: [fix/icon-cache-readability]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify workflow runner
        run: python -m compileall -q techtool.py tech_ui.py tech_secops4.py
