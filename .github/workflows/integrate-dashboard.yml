name: Integrate dashboard redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply integration
        run: python scripts/integrate_dashboard.py

      - name: Syntax check
        run: python -m py_compile tech_dashboard_redesign.py tech_hardening.py techtool.py tech_phone_mirror.py

      - name: Commit and clean bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tech_hardening.py tech_dashboard_redesign.py
          git rm scripts/integrate_dashboard.py .github/workflows/integrate-dashboard.yml
          git commit -m 'Integrate redesigned dashboard and scope scrcpy to dashboard'
          git push
