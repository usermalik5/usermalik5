name: Apply architecture refactor

on:
  push:
    branches: [agent/workflow-architecture]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          p = root / 'techtool.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '# Force-load the compatibility hooks (mirror manager, dashboard-after-login)\n'
              '# in source mode. The packaged EXE loads sitecustomize.py as a runtime hook.\n'
              'import sitecustomize  # noqa: F401\n\n', '')
          anchor = 'from tech_common import get_bundle_dir, get_app_dir, get_settings_dir, get_live_database_path, Tooltip, subprocess, load_package_database, APP_VERSION, THEME, THEMES, COLOR_SWAP, CANONICAL_DARK\n'
          additions = ('from tech_navigation import NavigationController\n'
                       'from tech_task_manager import TaskManager\n'
                       'from tech_database import DatabaseService\n')
          if additions not in s:
              s = s.replace(anchor, anchor + additions)
          s = s.replace('        self.user_perms = None\n', '        self.user_perms = None\n        self.task_manager = TaskManager(self.after)\n        self.database_service = DatabaseService(get_live_database_path())\n')
          s = s.replace('        self._extract_scrcpy()\n        os.environ["PATH"] = self.scrcpy_dir + os.pathsep + os.environ.get("PATH", "")\n        self._migrate_settings()\n        self._seed_database_defaults()\n', '')
          old_pages = '''        self.build_dashboard_page()\n        self.build_virustotal_tab()\n        self.build_security_tab()\n        self.build_monitor_tab()\n        self.build_dns_tab()\n        self._show_page("Dashboard")\n'''
          new_pages = '''        # Pages are created lazily after authentication. Dashboard is the first\n        # page created after login; other pages are built on first navigation.\n        self._page_factories = {\n            "Dashboard": self.build_dashboard_page,\n            "Adware Remover": self.build_security_tab,\n            "Monitor Running Apps": self.build_monitor_tab,\n            "Block Ads via DNS": self.build_dns_tab,\n            "VirusTotal": self.build_virustotal_tab,\n        }\n'''
          if old_pages not in s: raise SystemExit('expected page build block not found')
          s = s.replace(old_pages, new_pages)
          s = s.replace('        self.after(150, self.start_adb_device_monitor)\n', '')
          if '        self._navigation = NavigationController(self)\n' not in s:
              s = s.replace('        self.page_nav_btns = {}\n', '        self.page_nav_btns = {}\n        self._navigation = NavigationController(self)\n', 1)
          method = '''    def _show_page(self, name):\n        for n, frame in self.pages.items():\n            if n == name:\n                frame.grid()\n            else:\n                frame.grid_remove()\n        self._current_page = name\n        for n, btn in self.page_nav_btns.items():\n            active = (n == name)\n            try:\n                btn.configure(fg_color=THEME["accent"] if active else THEME["panel2"],\n                              text_color="#ffffff" if active else "#e8ecf2",\n                              hover_color=THEME["accent_h"] if active else "#1f6feb")\n            except Exception:\n                pass\n        if name == "Dashboard":\n            self.after(60, self._dash_refresh_if_visible)\n\n'''
          replacement = '''    def _show_page(self, name):\n        """Single application navigation entry point."""\n        return self._navigation.show(name)\n\n    def _initialize_runtime_after_login(self):\n        """Initialize device/runtime resources only after authentication."""\n        if getattr(self, "_runtime_initialized", False):\n            return\n        self._runtime_initialized = True\n        self._extract_scrcpy()\n        os.environ["PATH"] = self.scrcpy_dir + os.pathsep + os.environ.get("PATH", "")\n        self._migrate_settings()\n        if hasattr(self, "database_service"):\n            self.database_service.clear()\n        self._seed_database_defaults()\n        self._navigation.show_after_login()\n        self.after(150, self.start_adb_device_monitor)\n\n'''
          if method not in s: raise SystemExit('expected _show_page method not found')
          s = s.replace(method, replacement)
          s = s.replace('        self._purge_session_database()\n        self.destroy()\n', '        self._purge_session_database()\n        try:\n            self.task_manager.shutdown(wait=False)\n        except Exception:\n            pass\n        self.destroy()\n', 1)
          s = s.replace('        threading.Thread(target=worker, daemon=True).start()\n', '        self.task_manager.submit(worker)\n')
          p.write_text(s, encoding='utf-8')

          p = root / 'tech_settings.py'
          s = p.read_text(encoding='utf-8')
          old = '        self._uad_cache = load_package_database(get_live_database_path())\n        return self._uad_cache\n'
          new = '        service = getattr(self, "database_service", None)\n        if service is not None:\n            self._uad_cache = service.load()\n        else:\n            self._uad_cache = load_package_database(get_live_database_path())\n        return self._uad_cache\n'
          if old not in s: raise SystemExit('expected _build_uad_lookup implementation not found')
          s = s.replace(old, new, 1)
          old = '''        if visible:\n            try:\n                self._show_page(visible[0])\n            except Exception:\n                pass\n'''
          new = '''        # Dashboard is the universal post-login landing page.\n        try:\n            self._show_page("Dashboard")\n        except Exception:\n            pass\n'''
          if old not in s: raise SystemExit('expected permission default-page block not found')
          s = s.replace(old, new, 1)
          marker = '                self.current_user = name\n'
          insertion = '                self._initialize_runtime_after_login()\n'
          if insertion not in s: s = s.replace(marker, insertion + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = root / 'README.md'
          s = p.read_text(encoding='utf-8')
          s = s.replace('The Dashboard phone mirror uses the native scrcpy stream embedded into the Dashboard phone widget; the existing log console is temporarily hidden during mirroring and restored when mirroring stops. The mirror compatibility layer retries log restoration if Tk has not completed its geometry update yet.', 'The Dashboard phone mirror uses the native scrcpy stream embedded into the Dashboard phone widget; the existing log console is temporarily hidden during mirroring and restored when mirroring stops. Mirror-specific compatibility helpers are isolated to the mirror subsystem and are not used for ordinary application navigation.')
          s = s.replace('## Agent / developer workflow', '## Development workflow')
          if 'python scripts/release.py' not in s:
              s += '''\n\n## Fast development/release commands\n\nSource smoke check:\n\n```bash\npython scripts/agent_preflight.py\npython -m compileall -q .\npython -m pytest -q\n```\n\nRelease build:\n\n```bash\npython scripts/release.py\n```\n\nThe release helper performs repository preflight, Python compile checks, tests, PyArmor generation, and the supported obfuscated PyInstaller build. It does not commit, tag, or push anything automatically.\n'''
          p.write_text(s, encoding='utf-8')
          print('Architecture refactor applied.')
          PY

      - name: Validate source
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m compileall -q .
          python -m pytest -q

      - name: Commit refactor and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-architecture-refactor.yml
          git add techtool.py tech_settings.py README.md
          git add tech_navigation.py tech_task_manager.py tech_database.py scripts tests docs AGENTS.md PROCESS_GUIDE.md 2>/dev/null || true
          git status --short
          git commit -m "Implement efficient application workflow architecture"
          git push origin agent/workflow-architecture
