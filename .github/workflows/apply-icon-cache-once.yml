name: Apply icon cache migration once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source migration
        run: python scripts/apply_icon_cache_fix.py

      - name: Correct automatic device hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('techtool.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('    def _auto_prepare_new_device_icons(self, devices):')
          end = s.index('    def _toggle_theme(self):', start)
          method = '''    def _auto_prepare_new_device_icons(self, devices):
              """Prepare icons for a newly observed device; persistent cache verification happens in the icon worker."""
              try:
                  if len(devices) != 1:
                      if len(devices) > 1:
                          self.log_message("[GeloTech] Multiple ADB devices connected; automatic icon sync waits for one device.")
                      return
                  serial = devices[0]
                  if serial in self._icon_sync_seen_serials:
                      return
                  self._icon_sync_seen_serials.add(serial)
                  self._sec_icon_cache = {}
                  self._sec_tree_icon_cache = {}
                  self._app_labels = None
                  self.log_message(f"[GeloTech] Device ready: {serial}. Checking saved icon cache...")
                  self.after(800, lambda: self.action_sec_show_icons(automatic=True))
              except Exception as exc:
                  self.log_message(f"[GeloTech] Automatic icon preparation skipped: {exc}")

'''
          p.write_text(s[:start] + method + s[end:], encoding='utf-8')
          PY

      - name: Verify source
        run: |
          python -m compileall -q techtool.py tech_ui.py tech_secops4.py
          python - <<'PY'
          from pathlib import Path
          sec4 = Path('tech_secops4.py').read_text(encoding='utf-8')
          app = Path('techtool.py').read_text(encoding='utf-8')
          ui = Path('tech_ui.py').read_text(encoding='utf-8')
          required = [
              'def _icon_device_cache_dir(self, serial):',
              'def _icon_wait_for_helper(self, attempts=4, delay=1.0):',
              'def _icon_package_fingerprint(self):',
              'def action_sec_show_icons(self, automatic=False, force=False):',
              'self.action_sec_show_icons(automatic=True)',
              'self._fix_button_text_colors(self._theme_mode)',
          ]
          combined = sec4 + app + ui
          missing = [marker for marker in required if marker not in combined]
          if missing:
              raise SystemExit(f'Missing expected source markers: {missing}')
          assert 'Device ready:' in app
          assert 'Installing APKIconHelper on device...' not in sec4
          print('Source verification passed.')
          PY

      - name: Commit application changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add techtool.py tech_ui.py tech_secops4.py
          git rm scripts/apply_icon_cache_fix.py .github/workflows/apply-icon-cache-once.yml
          git commit -m "feat: make icon sync seamless and less intrusive"
          git push origin main
